<section class="sign-in">
  <div class="collage" aria-hidden="true">
    @for (src of posters(); track $index) {
      <img [src]="src" alt="" loading="lazy" />
    }
  </div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="card">
    <a class="icon-btn close" routerLink="/" [attr.aria-label]="'action_close' | transloco">
      <span class="icon" aria-hidden="true">close</span>
    </a>
    <h1 class="t-display brand">movie<span>nee</span></h1>
    <p class="t-small t-secondary origin">movie + matinee</p>
    <p class="t-body-lg t-secondary tagline">{{ 'sign_in_tagline' | transloco }}</p>

    @if (error(); as e) {
      <p class="error" role="alert">{{ e.message ?? (e.key ?? '' | transloco) }}</p>
    }

    <button class="google" type="button" (click)="signIn()" [disabled]="busy()">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
        <path
          fill="#EA4335"
          d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 7.2-9.6 7.2-17z"
        />
        <path
          fill="#FBBC05"
          d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"
        />
        <path
          fill="#34A853"
          d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.2-8.8 2.2-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"
        />
      </svg>
      {{ (busy() ? 'sign_in_loading' : 'sign_in_google_button') | transloco }}
    </button>

    <p class="t-small t-muted terms">{{ 'sign_in_terms' | transloco }}</p>
  </div>
</section>
