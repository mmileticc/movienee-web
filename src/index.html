<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Movienee</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Movienee - discover movies with friends and see where they are playing."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Only the icons the app uses (1.4 MB -> ~22 kB). A new icon must be added here in alphabetical
      order; `npm run check:icons` (part of `npm run lint`, so CI checks it) fails when one is missing.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=account_circle,arrow_back,bookmark,bookmark_add,bookmark_added,bookmark_remove,brightness_auto,check_circle,chevron_left,chevron_right,close,dark_mode,delete,edit,error,expand_less,expand_more,favorite,filter_alt_off,grid_view,group,group_add,history,home,how_to_reg,image_search,info,install_mobile,light_mode,local_movies,location_on,lock,login,logout,movie,movie_filter,movie_off,near_me,notifications,notifications_none,person,person_add,person_remove,person_search,photo_camera,play_arrow,search,search_off,send,share,star,theaters,video_library,view_list,visibility&display=block"
      rel="stylesheet"
    />
    <script src="theme-init.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
